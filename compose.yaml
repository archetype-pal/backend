# Local development stack ONLY. This file exists so developers can run the
# backend with one command (`just up`) and to back the compose-based test
# recipes used by CI. It is not a deployment artifact — staging/production
# run from the infrastructure repo (archetype-pal/infrastructure), which owns
# nginx/TLS, healthchecked service ordering, image pinning, and backups.
# Distinct from the infrastructure stack's `archetype` project.
name: archetype-dev
services:
  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    environment:
      - MEILI_ENV=${MEILI_ENV}
      # Migrate the on-disk index format in place when the image is bumped to a
      # newer Meilisearch. Without this, a version mismatch (e.g. data written by
      # 1.45.2 vs engine 1.50.0) makes the server refuse to start. No-op when the
      # versions already match. Safe here: the one embedder, `glyph` on the graphs
      # index, holds copies of vectors kept in Postgres, and calls no model;
      # `just sync-search-index graphs` rebuilds them.
      # Meilisearch 1.55 ignores the old MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE name.
      - MEILI_UPGRADE_DB=true
    # No MEILI_MASTER_KEY in development: requests without a key are allowed.
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"

  postgres:
    # Stay on the bookworm (glibc 2.36) base: the data dir's collation was
    # created with 2.36, and the trixie base (glibc 2.41) triggers a collation
    # version mismatch that would force a REINDEX. The postgres image isn't
    # CVE-scanned by CD, so a newer base buys nothing here.
    # POSTGRES_IMAGE is overridden by scripts/upgrade-postgres-17-to-18-local.sh.
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    volumes:
      # PostgreSQL 18 Docker images use versioned PGDATA under /var/lib/postgresql.
      # Keep the volume mounted at the parent so future major upgrades can use
      # the official versioned layout.
      - postgres18:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=${PGDATA}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    # Local-only tag built from this checkout. Release images are built by CI
    # (cd.yml) and consumed by the infrastructure repo — never by this file.
    image: archetype-backend:local
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - MEILISEARCH_URL=${MEILISEARCH_URL}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - MEILISEARCH_INDEX_PREFIX=${MEILISEARCH_INDEX_PREFIX}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - IIIF_HOST=${IIIF_HOST}
      - IIIF_INTERNAL_HOST=${IIIF_INTERNAL_HOST}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - SITE_NAME=${SITE_NAME}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN}
      - CSRF_COOKIE_DOMAIN=${CSRF_COOKIE_DOMAIN}
      - SEARCH_AUTO_SYNC=${SEARCH_AUTO_SYNC}
      - HISTORICAL_ITEM_TYPES=${HISTORICAL_ITEM_TYPES}
      - HISTORICAL_ITEM_HAIR_TYPES=${HISTORICAL_ITEM_HAIR_TYPES}
      - REPOSITORY_TYPES=${REPOSITORY_TYPES}
      - CHARACTER_ITEM_TYPES=${CHARACTER_ITEM_TYPES}
      - LOG_IN_FILE=${LOG_IN_FILE}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SERVER_EMAIL=${SERVER_EMAIL}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
    ports:
      - "8000:80"
    command: python manage.py runserver 0.0.0.0:80 --nostatic
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
      redis:
        condition: service_healthy

  image_server:
    image: daschswiss/sipi:v10.0.0  # keep in lockstep with infrastructure/compose.yaml (docs/sipi.md there)
    restart: "on-failure:3"
    ports:
      # Host port 8182, not 1024 — resident software routinely squats 1024
      # (e.g. on Windows/WSL, silently 404-ing every IIIF request).
      # Bind only to loopback so VPN/LAN hosts cannot reach the dev server.
      - "127.0.0.1:8182:1024"
    environment:
      # SIPI v10+ refuses to start on the stock config's demo jwt_secret. Dev-only
      # value; nothing in the dev stack uses SIPI JWTs.
      SIPI_JWTKEY: archetype-local-dev-only-sipi-jwt-secret42
    volumes:
      - ./storage/media:/sipi/images
    healthcheck:
      test: ["CMD", "/sbin/sipi", "health", "--port", "1024"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    # Pinned exactly rather than to the floating `8-alpine` tag, which has
    # already walked 8.0 -> 8.8 in place and makes builds non-reproducible.
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  celery:
    image: archetype-backend:local
    command: celery -A config worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MEILISEARCH_URL=${MEILISEARCH_URL}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      # The worker runs the sync tasks, so the kill switch has to reach it too.
      - SEARCH_AUTO_SYNC=${SEARCH_AUTO_SYNC}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SERVER_EMAIL=${SERVER_EMAIL}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  celery_learn:
    # The tutor's lessons (AI programme W4.4) take minutes each, so they have
    # their own queue and this worker. Opt-in with the tutor:
    #   docker compose --env-file config/.env --profile learn up -d celery_learn
    profiles: ["learn"]
    image: archetype-backend:local
    command: celery -A config worker -l info -Q learn -c 2 -n learn@%h
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MEILISEARCH_URL=${MEILISEARCH_URL}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      # The worker runs the sync tasks, so the kill switch has to reach it too.
      - SEARCH_AUTO_SYNC=${SEARCH_AUTO_SYNC}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SERVER_EMAIL=${SERVER_EMAIL}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  embedder:
    # The self-hosted glyph encoder (AI programme W1.2; see embedder/server.py).
    # Opt-in, because building it downloads torch and the weights:
    #   docker compose --env-file config/.env --profile ml up -d embedder
    # then set ML_EMBEDDER_URL=http://embedder:8080 in config/.env. It is reached
    # only over this network; no host port is published.
    profiles: ["ml"]
    image: archetype-embedder:local
    build: ./embedder
    restart: "on-failure:3"

  htr:
    # The self-hosted reader (AI programme W1.4; see htr/server.py). Opt-in, as
    # the embedder is:
    #   docker compose --env-file config/.env --profile ml up -d htr
    # then set ML_HTR_URL=http://htr:8080 in config/.env. It is reached only
    # over this network; no host port is published.
    profiles: ["ml"]
    image: archetype-htr:local
    build: ./htr
    restart: "on-failure:3"
    volumes:
      # The letter models (W1.1), if trained: `htr/train_letters.py --out
      # storage/models/letters`. Without them /letters answers 503.
      - ./storage/models/letters:/models/letters:ro

volumes:
  postgres18:
  meilisearch_data:
