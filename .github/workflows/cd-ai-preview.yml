name: CD AI preview

# Only the ai-preview tag. backend:latest is what beta deploys, so this workflow
# must never publish it.
on:
  push:
    branches: [ai-programme]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute release version
        run: |
          echo "APP_VERSION=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_ENV"
          echo "APT_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_COMMIT=${{ github.sha }}
            APT_REFRESH=${{ env.APT_REFRESH }}
          tags: |
            ghcr.io/archetype-pal/backend:ai-preview
            ghcr.io/archetype-pal/backend:ai-preview-sha-${{ github.sha }}
          cache-from: type=gha,scope=ai-preview
          cache-to: type=gha,scope=ai-preview,mode=max
