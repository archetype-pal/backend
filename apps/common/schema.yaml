openapi: 3.0.3
info:
  title: Archetype V3
  version: 1.0.0 (v1)
paths:
  /api/v1/schema/:
    get:
      operationId: placeholder
      security:
        - api_key: []
      responses:
        204:
          description: No response body
      tags:
        - docs
  /api/v1/site-labels/:
    get:
      operationId: site-labels-get
      responses:
        200:
          description: Customizable UI label translations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteLabels'
      tags:
        - common
    put:
      operationId: site-labels-update
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteLabelsWrite'
      responses:
        200:
          description: Updated label translations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteLabels'
      tags:
        - common
  /api/v1/site-features/:
    get:
      operationId: site-features-get
      responses:
        200:
          description: Public site-features configuration blob.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFeatures'
      tags:
        - common
    put:
      operationId: site-features-update
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteFeaturesWrite'
      responses:
        200:
          description: Updated site-features configuration blob.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFeatures'
      tags:
        - common
  /api/v1/management/common/dates/:
    get:
      operationId: management-dates-list
      security:
        - api_key: []
      responses:
        200:
          description: List dates for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagementDate'
      tags:
        - common-management
    post:
      operationId: management-dates-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementDateWrite'
      responses:
        201:
          description: Created date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDate'
      tags:
        - common-management
  /api/v1/management/common/dates/{id}/:
    patch:
      operationId: management-dates-update
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Updated date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDate'
      tags:
        - common-management
    delete:
      operationId: management-dates-delete
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Date deleted.
      tags:
        - common-management
  /api/v1/management/common/sanity-checks/:
    get:
      operationId: management-sanity-checks
      security:
        - api_key: []
      responses:
        200:
          description: Operational health snapshot (migrations, services, storage, permissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanityChecks'
      tags:
        - common-management
  /api/v1/management/common/sanity-checks/test-email/:
    post:
      operationId: management-sanity-checks-test-email
      security:
        - api_key: []
      responses:
        200:
          description: Test email sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResult'
        400:
          description: SMTP is not configured, or no ADMIN_EMAILS are set to send to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResult'
        502:
          description: SMTP is configured but delivery failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResult'
      tags:
        - common-management
  /api/v1/search/management/stats/:
    get:
      operationId: management-search-stats
      security:
        - api_key: []
      responses:
        200:
          description: Search index health and stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchManagementStats'
      tags:
        - search-management
  /api/v1/search/management/actions/:
    post:
      operationId: management-search-actions
      security:
        - api_key: []
      responses:
        200:
          description: Accepted search management action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchManagementActionResponse'
      tags:
        - search-management
  /api/v1/search/management/tasks/{task_id}/:
    get:
      operationId: management-search-task-status
      security:
        - api_key: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Search management task status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchManagementTaskStatus'
      tags:
        - search-management
components:
  schemas:
    docs:
      type: object
    SiteLabels:
      type: object
      properties:
        labels:
          type: object
          additionalProperties: true
    SiteLabelsWrite:
      type: object
      required:
        - labels
      properties:
        labels:
          type: object
          additionalProperties: true
    SiteFeatures:
      type: object
      additionalProperties: true
    SiteFeaturesWrite:
      type: object
      required:
        - sections
        - searchCategories
      additionalProperties: true
    ManagementDate:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        min_weight:
          type: integer
        max_weight:
          type: integer
    ManagementDateWrite:
      type: object
      properties:
        date:
          type: string
        min_weight:
          type: integer
        max_weight:
          type: integer
    ServiceStatus:
      type: object
      properties:
        ok:
          type: boolean
        detail:
          type: string
          nullable: true
    SanityChecks:
      type: object
      properties:
        migrations:
          type: object
          properties:
            ok:
              type: boolean
              description: False when the migration plan could not be computed.
            has_pending:
              type: boolean
              nullable: true
              description: Null when unknown (ok is false).
            pending:
              type: array
              items:
                type: string
            detail:
              type: string
              nullable: true
        services:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/ServiceStatus'
            redis:
              $ref: '#/components/schemas/ServiceStatus'
            meilisearch:
              $ref: '#/components/schemas/ServiceStatus'
            celery_broker:
              $ref: '#/components/schemas/ServiceStatus'
            celery_workers:
              type: object
              description: Worker liveness — a reachable broker with no consumer still drops every task.
              properties:
                ok:
                  type: boolean
                workers:
                  type: integer
                detail:
                  type: string
                  nullable: true
        email:
          type: object
          properties:
            backend:
              type: string
              description: Dotted path of the configured EMAIL_BACKEND.
            smtp_configured:
              type: boolean
        database:
          type: object
          properties:
            size_bytes:
              type: integer
              nullable: true
        media:
          type: object
          properties:
            path:
              type: string
            size_bytes:
              type: integer
            writable:
              type: boolean
        logs:
          type: object
          properties:
            configured:
              type: boolean
              description: Whether LOGGING declares a file handler. False on this deployment (stdout only).
            path:
              type: string
              nullable: true
            writable:
              type: boolean
              nullable: true
    TestEmailResult:
      type: object
      properties:
        sent:
          type: boolean
        detail:
          type: string
          nullable: true
    SearchManagementIndexStat:
      type: object
      properties:
        index_type:
          type: string
        uid:
          type: string
        label:
          type: string
        meilisearch_count:
          type: integer
        db_count:
          type: integer
        in_sync:
          type: boolean
    SearchManagementStats:
      type: object
      properties:
        healthy:
          type: boolean
        total_meilisearch:
          type: integer
        total_database:
          type: integer
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/SearchManagementIndexStat'
    SearchManagementActionResponse:
      type: object
      properties:
        task_id:
          type: string
        task_ids:
          type: array
          items:
            type: string
        message:
          type: string
    SearchManagementTaskStatus:
      type: object
      properties:
        task_id:
          type: string
        state:
          type: string
        progress:
          type: object
          nullable: true
        result:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
  securitySchemes:
    api_key:
      type: apiKey
      description: "value should start with 'Token' followed by a space then the token"
      name: Authorization
      in: header
tags:
  - name: docs
    description: API documentation in OpenAPI format
  - name: common
    description: Shared, site-wide configuration
  - name: common-management
    description: Management endpoints for shared lookup data
  - name: search-management
    description: Search index management operations
