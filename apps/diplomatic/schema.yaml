openapi: 3.0.3
info:
  title: Archetype Diplomatic API
  version: 1.0.0

tags:
  - name: Diplomatic
    description: >-
      Phase 2 of the AI programme: entities, formulae and knowledge-graph
      triples read out of charter texts. Two surfaces with opposite audiences.
      `/management/diplomatic-proposals/` is the superuser review gate and the only
      route by which a machine suggestion becomes a record; the public
      collections below contain, by construction, only what a named human
      approved.

paths:
  /api/v1/management/diplomatic-proposals/:
    get:
      operationId: diplomatic-proposals-list
      summary: List machine-authored proposals awaiting review
      description: >-
        Superuser only. Filter by `pipeline` (W2.1, W2.2, W2.4, W3.2, W3.3),
        `status`, `source_type` or `source_id`.
      tags: [Diplomatic]
      parameters:
        - in: query
          name: pipeline
          schema: { type: string, example: W2.1 }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, rejected]
        - in: query
          name: source_type
          schema: { type: string, example: imagetext }
        - in: query
          name: source_id
          schema: { type: integer }
      responses:
        "200":
          description: A page of proposals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
        "403":
          description: Not a superuser.

  /api/v1/management/diplomatic-proposals/depth/:
    get:
      operationId: diplomatic-proposals-depth
      summary: Count the proposals awaiting review, in total and per pipeline
      description: >-
        The number the reviewer-capacity stop rule reads. Every registered
        pipeline appears in `by_pipeline`, with zero when nothing of its awaits
        review.
      tags: [Diplomatic]
      responses:
        "200":
          description: Pending counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending: { type: integer }
                  by_pipeline:
                    type: object
                    additionalProperties: { type: integer }
                    example: { W2.1: 4, W2.2: 0, W2.4: 1, W3.2: 2, W3.3: 0 }
        "403":
          description: Not a superuser.

  /api/v1/management/diplomatic-proposals/{id}/:
    get:
      operationId: diplomatic-proposals-retrieve
      summary: Retrieve one proposal, with the charter text its model read
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDetail"
        "403":
          description: Not a superuser.
        "404":
          description: No such proposal.

  /api/v1/management/diplomatic-proposals/{id}/accept/:
    post:
      operationId: diplomatic-proposals-accept
      summary: Approve a proposal and write the records it describes
      description: >-
        The only path from a machine suggestion to a canonical record. Recorded
        against the authenticated reviewer. A proposal that has already been
        decided returns 409 rather than being decided twice.
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Accepted; `created` counts the rows written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
                  created: { type: integer, example: 7 }
        "403":
          description: Not a superuser.
        "409":
          description: Already decided, or the records cannot be written.

  /api/v1/management/diplomatic-proposals/{id}/reject/:
    post:
      operationId: diplomatic-proposals-reject
      summary: Reject a proposal
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: rejected }
        "403":
          description: Not a superuser.
        "409":
          description: Already decided.

  /api/v1/diplomatic/summary/:
    get:
      operationId: diplomatic-summary
      summary: How much approved material the reader can see
      description: >-
        Counts of the formulae, entities and relations the reader may see. The
        site's navigation reads it to offer the formulary and the network only
        once there is something in them.
      tags: [Diplomatic]
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  formulae: { type: integer }
                  entities: { type: integer }
                  relations: { type: integer }

  /api/v1/diplomatic/network/:
    get:
      operationId: diplomatic-network
      summary: The witness and scribe network
      description: >-
        People, places, charters and scribes, and what connects them, from the
        approved entities and relations of the texts the reader may see, plus
        the scribe attributions of those charters. A charter is its item part.
        Names are the charter's own wording, unresolved: two spellings of one
        person are two nodes.
      tags: [Diplomatic]
      responses:
        "200":
          description: The whole network.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NetworkNode" }
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/NetworkEdge" }

  /api/v1/diplomatic/network/gexf/:
    get:
      operationId: diplomatic-network-gexf
      summary: Download the network as GEXF
      description: The same network as GEXF 1.3, for Gephi and the other graph tools.
      tags: [Diplomatic]
      responses:
        "200":
          description: A GEXF file, sent as an attachment.
          content:
            application/gexf+xml:
              schema: { type: string }

  /api/v1/diplomatic/entities/:
    get:
      operationId: diplomatic-entities-list
      summary: List approved charter entities
      description: Granters, beneficiaries, witnesses, places, dates and transaction types.
      tags: [Diplomatic]
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [granter, beneficiary, witness, place, date, transaction]
        - in: query
          name: image_text
          schema: { type: integer }
      responses:
        "200":
          description: A page of entities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CharterEntity"

  /api/v1/diplomatic/entities/{id}/:
    get:
      operationId: diplomatic-entities-retrieve
      summary: Retrieve one entity
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharterEntity"
        "404":
          description: No such entity.

  /api/v1/diplomatic/formulae/:
    get:
      operationId: diplomatic-formulae-list
      summary: List approved diplomatic formulae
      description: >-
        Clusters, not single occurrences. `published_type` records the
        correspondence to MoA's published formulary typology; a cluster with an
        empty `published_type` matches nothing published, which is the
        interesting case.
      tags: [Diplomatic]
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [sanctio, corroboratio, dispositive, salutation, notification, other]
        - in: query
          name: published_type
          schema: { type: string }
        - in: query
          name: search
          description: Words in the label, the exemplar or the published type.
          schema: { type: string }
      responses:
        "200":
          description: A page of formulae.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Formula"

  /api/v1/diplomatic/formulae/{id}/:
    get:
      operationId: diplomatic-formulae-retrieve
      summary: Retrieve one formula and every charter that uses it
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The formula.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Formula"
        "404":
          description: No such formula.

  /api/v1/diplomatic/relations/:
    get:
      operationId: diplomatic-relations-list
      summary: List approved knowledge-graph triples
      tags: [Diplomatic]
      parameters:
        - in: query
          name: predicate
          schema:
            type: string
            enum: [granted_by, witnessed_by, written_by, beneficiary_of, located_at]
        - in: query
          name: image_text
          schema: { type: integer }
      responses:
        "200":
          description: A page of relations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relation"

  /api/v1/diplomatic/relations/{id}/:
    get:
      operationId: diplomatic-relations-retrieve
      summary: Retrieve one triple
      tags: [Diplomatic]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The relation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relation"
        "404":
          description: No such relation.

components:
  schemas:
    ProposalSource:
      type: object
      nullable: true
      description: >-
        The charter transcription a proposal was read from. Null when the
        source is not a transcription, or no longer exists.
      properties:
        image_text: { type: integer }
        type: { type: string, example: Transcription }
        item_image: { type: integer }
        item_part: { type: integer, description: "With item_image, the viewer's route." }
        historical_item: { type: integer }
        label: { type: string, description: "The page's label, as on an annotation." }
        date:
          type: string
          description: The catalogue date; what a W3.2 verdict was judged against. Empty when undated.

    Proposal:
      type: object
      description: Read-only. A proposal is accepted or rejected, never edited.
      properties:
        id: { type: integer }
        pipeline: { type: string, example: W2.1 }
        source_type: { type: string, example: imagetext }
        source_id: { type: integer }
        source:
          $ref: "#/components/schemas/ProposalSource"
        payload:
          type: object
          additionalProperties: true
          description: The parsed model output, in the shape its pipeline defines.
        confidence: { type: number, nullable: true }
        ml_job:
          type: integer
          nullable: true
          description: The inference ledger entry this came from.
        model_name:
          type: string
          description: The model that produced it, from its ledger entry; empty when there is none.
        status:
          type: string
          enum: [pending, accepted, rejected]
        reviewer: { type: integer, nullable: true }
        reviewer_username: { type: string }
        reviewed: { type: string, format: date-time, nullable: true }
        reason: { type: string }
        created: { type: string, format: date-time }

    ProposalDetail:
      allOf:
        - $ref: "#/components/schemas/Proposal"
        - type: object
          properties:
            source_text:
              type: string
              description: >-
                The charter's text as the model read it, TEI stripped and
                truncated past 12,000 characters, for checking the proposal
                against.

    NetworkNode:
      type: object
      properties:
        id: { type: string, example: "person:walterus" }
        label: { type: string }
        kind:
          type: string
          enum: [charter, person, place, scribe]
        record:
          type: integer
          nullable: true
          description: The item part of a charter or the id of a scribe; null for a name read in a text.
    NetworkEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        relation:
          type: string
          description: >-
            A role (granter, beneficiary, witness), located_at, scribe, or a
            relation's predicate.
        charter:
          type: string
          description: For a relation between two people, the charter that states it; otherwise empty.
    Charter:
      type: object
      description: >-
        The text a public record came from. Records whose text the reader may
        not see (a draft, for anyone but staff) are not served at all.
      properties:
        image_text: { type: integer }
        type: { type: string, example: Transcription }
        item_image: { type: integer }
        item_part: { type: integer, description: "With item_image, the viewer's route." }
        locus: { type: string, example: face }
        shelfmark: { type: string }
        repository: { type: string }
        date: { type: string, description: The catalogue date. Empty when undated. }

    CharterEntity:
      type: object
      properties:
        id: { type: integer }
        image_text: { type: integer }
        charter: { $ref: "#/components/schemas/Charter" }
        role:
          type: string
          enum: [granter, beneficiary, witness, place, date, transaction]
        name:
          type: string
          description: The surface form as the charter writes it, kept verbatim.
        normalised: { type: string }
        note: { type: string }
        proposal: { type: integer, nullable: true }
        created: { type: string, format: date-time }

    FormulaOccurrence:
      type: object
      properties:
        id: { type: integer }
        image_text: { type: integer }
        charter: { $ref: "#/components/schemas/Charter" }
        excerpt: { type: string }

    Formula:
      type: object
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [sanctio, corroboratio, dispositive, salutation, notification, other]
        label: { type: string }
        exemplar: { type: string }
        published_type: { type: string }
        occurrence_count: { type: integer, description: The occurrences this reader may see. }
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/FormulaOccurrence"
        created: { type: string, format: date-time }

    Relation:
      type: object
      properties:
        id: { type: integer }
        image_text: { type: integer }
        charter: { $ref: "#/components/schemas/Charter" }
        subject: { type: string }
        predicate:
          type: string
          enum: [granted_by, witnessed_by, written_by, beneficiary_of, located_at]
        object: { type: string }
        proposal: { type: integer, nullable: true }
        created: { type: string, format: date-time }
