components:
  schemas:
    carouselItem:
      type: object
      properties:
        title:
          type: string
        image:
          type: string
        link:
          type: string
    eventListItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
    eventDetailItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    publicationListItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        author:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        number_of_comments:
          type: integer
        published_at:
          type: string
          format: date-time
        preview:
          type: string
    publicationDetailItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        author:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        number_of_comments:
          type: integer
        published_at:
          type: string
          format: date-time
        content:
          type: string
        allow_comments:
          type: boolean
        comments:
          type: array
          items:
            $ref: '#/components/schemas/publicThreadComment'
    publicThreadComment:
      allOf:
        - $ref: '#/components/schemas/publicComment'
        - type: object
          properties:
            removed:
              type: boolean
              description: True for a comment that is no longer shown but still has a shown reply. It then has only id, parent and removed.
    publicComment:
      type: object
      properties:
        id:
          type: integer
        parent:
          type: integer
          nullable: true
        author_name:
          type: string
        content:
          type: string
          description: HTML.
        created_at:
          type: string
          format: date-time
    commentEmailSetting:
      type: object
      required:
        - email_enabled
      properties:
        email_enabled:
          type: boolean
    createdComment:
      allOf:
        - $ref: '#/components/schemas/publicComment'
        - type: object
          properties:
            is_approved:
              type: boolean
    publicCommentWrite:
      type: object
      required:
        - content
      properties:
        parent:
          type: integer
          nullable: true
        author_name:
          type: string
          maxLength: 150
          description: Required for guests. Ignored when signed in.
        author_email:
          type: string
          format: email
          description: Optional. Ignored when the signed-in account has an email.
        content:
          type: string
          maxLength: 10000
          description: Plain text. Stored as escaped HTML paragraphs.
    publicationManagementItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        preview:
          type: string
        author:
          type: integer
          nullable: true
        author_name:
          type: string
          nullable: true
        status:
          type: string
        is_blog_post:
          type: boolean
        is_news:
          type: boolean
        is_featured:
          type: boolean
        allow_comments:
          type: boolean
        comment_count:
          type: integer
    publicationManagementWrite:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        preview:
          type: string
        status:
          type: string
        is_blog_post:
          type: boolean
        is_news:
          type: boolean
        is_featured:
          type: boolean
        allow_comments:
          type: boolean
    commentManagementItem:
      type: object
      properties:
        id:
          type: integer
        post:
          type: integer
        post_title:
          type: string
        post_slug:
          type: string
        parent_author_name:
          type: string
          nullable: true
          description: Author of the comment this one replies to, null for a top level comment.
        parent_content:
          type: string
          nullable: true
          description: HTML of the comment this one replies to.
        content:
          type: string
        author_name:
          type: string
        author_email:
          type: string
        author_website:
          type: string
        is_approved:
          type: boolean
    carouselManagementItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        image:
          type: string
        ordering:
          type: integer
    partnerItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        logo:
          type: string
        ordering:
          type: integer
tags:
  - name: events
  - name: Media & publications
  - name: media-management
