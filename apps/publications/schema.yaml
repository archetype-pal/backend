paths:
  /api/v1/media/carousel-items/:
    get:
      operationId: carousel-items-list
      responses:
        200:
          description: List of carousel items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/carouselItem'

      tags:
        - Media & publications
  /api/v1/media/partners/:
    get:
      operationId: partners-list
      responses:
        200:
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/partnerItem'
      tags:
        - Media & publications
  /api/v1/media/events/:
    get:
      operationId: events-list
      responses:
        200:
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    format: uri
                  previous:
                    type: string
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/eventListItem'
      tags:
        - Media & publications
  /api/v1/media/events/{slug}/:
    get:
      operationId: events-detail
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventDetailItem'
      tags:
        - Media & publications
  /api/v1/media/management/publications/:
    get:
      operationId: management-publications-list
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: search
          in: query
          description: Matches title and slug.
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ Draft, Published ]
        - name: is_blog_post
          in: query
          required: false
          schema:
            type: boolean
        - name: is_news
          in: query
          required: false
          schema:
            type: boolean
        - name: is_featured
          in: query
          required: false
          schema:
            type: boolean
        - name: ordering
          in: query
          description: Comma separated fields, prefix `-` for descending, using `title`, `comment_count`, `created_at`. Ties are broken by id.
          required: false
          schema:
            type: string
      security:
        - api_key: []
      responses:
        200:
          description: List publications for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/publicationManagementItem'
      tags:
        - media-management
    post:
      operationId: management-publications-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicationManagementWrite'
      responses:
        201:
          description: Created publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicationManagementItem'
      tags:
        - media-management
  /api/v1/media/management/events/:
    get:
      operationId: management-events-list
      security:
        - api_key: []
      responses:
        200:
          description: List events for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eventDetailItem'
      tags:
        - media-management
    post:
      operationId: management-events-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventDetailItem'
      responses:
        201:
          description: Created event row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventDetailItem'
      tags:
        - media-management
  /api/v1/media/management/comments/:
    get:
      operationId: management-comments-list
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: search
          in: query
          description: Matches author name, author email, content and post title.
          required: false
          schema:
            type: string
        - name: post
          in: query
          required: false
          schema:
            type: integer
        - name: is_approved
          in: query
          required: false
          schema:
            type: boolean
      security:
        - api_key: []
      responses:
        200:
          description: List comments for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/commentManagementItem'
      tags:
        - media-management
    post:
      operationId: management-comments-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/commentManagementItem'
      responses:
        201:
          description: Created comment row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commentManagementItem'
      tags:
        - media-management
  /api/v1/media/management/comments/email-setting/:
    get:
      operationId: management-comments-email-setting-retrieve
      description: Whether the signed in superuser gets an email when a comment starts waiting for approval.
      security:
        - api_key: []
      responses:
        200:
          description: The signed in superuser's setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commentEmailSetting'
      tags:
        - media-management
    patch:
      operationId: management-comments-email-setting-update
      description: Turn these emails on or off for the signed in superuser.
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/commentEmailSetting'
      responses:
        200:
          description: The saved setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/commentEmailSetting'
      tags:
        - media-management
  /api/v1/media/management/carousel-items/:
    get:
      operationId: management-carousel-items-list
      security:
        - api_key: []
      responses:
        200:
          description: List carousel items for management.
