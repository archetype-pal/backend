  /api/v1/media/management/partners/:
    get:
      operationId: management-partners-list
      security:
        - api_key: []
      responses:
        200:
          description: List partners for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/partnerItem'
      tags:
        - media-management
    post:
      operationId: management-partners-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/partnerItem'
      responses:
        201:
          description: Created partner row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/partnerItem'
      tags:
        - media-management
  /api/v1/media/publications/:
    get:
      operationId: publications-list
      parameters:
        - name: is_blog_post
          in: query
          required: false
          schema:
            type: boolean
        - name: is_news
          in: query
          required: false
          schema:
            type: boolean
        - name: is_featured
          in: query
          required: false
          schema:
            type: boolean
        - name: recent_posts
          in: query
          required: false
          schema:
            type: boolean
          description: When set to true, returns the 5 most recent posts ordered by their `published_at` field, regardless of any category filters.
      responses:
        200:
          description: No response body
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    format: uri
                  previous:
                    type: string
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/publicationListItem'
      tags:
        - Media & publications
  /api/v1/media/publications/{slug}/:
    get:
      operationId: publications-detail
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/publicationDetailItem'
      tags:
        - Media & publications
  /api/v1/media/publications/{slug}/comments/:
    post:
      operationId: publications-comments-create
      description: Submit a comment, or a reply to an approved comment, on a published publication that allows comments. A guest's comment waits for moderation. A signed-in user's comment takes the name from the account, and the email too when the account has one. A superuser's comment is approved at once. A comment that waits for moderation is emailed to the superusers who have not turned these emails off.
      parameters:
        - $ref: '#/components/parameters/slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicCommentWrite'
      responses:
        201:
          description: Comment received. Shown at once when is_approved is true, otherwise after moderation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createdComment'
        400:
          description: Invalid comment, or a parent that is not an approved comment on this publication.
        403:
          description: Comments are closed on this publication.
        404:
          description: No published publication with this slug.
        429:
          description: Too many comments from this address in the last hour.
      tags:
        - Media & publications
