paths:
  /api/v1/scribes/{id}/:
    get:
      operationId: scribes-details
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scribe'
      tags:
        - scribes
  /api/v1/hands/:
    get:
      operationId: hands-list
      parameters:
        - name: item_part
          in: query
          required: false
          schema:
            type: integer
        - name: item_part_images
          in: query
          required: false
          schema:
            type: integer
        - name: scribe
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hand'
      tags:
        - scribes
  /api/v1/hands/{id}/:
    get:
      operationId: hands-details
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hand'
      tags:
        - scribes
  /api/v1/management/scribes/scribes/:
    get:
      operationId: management-scribes-list
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: search
          in: query
          description: Matches name and scriptorium.
          required: false
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: integer
        - name: ordering
          in: query
          description: Comma separated fields, prefix `-` for descending, using `name`, `hand_count`. Ties are broken by id.
          required: false
          schema:
            type: string
      security:
        - api_key: []
      responses:
        200:
          description: List scribes for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScribeManagementItem'
      tags:
        - scribes-management
    post:
      operationId: management-scribes-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScribeManagementItem'
      responses:
        201:
          description: Created scribe row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScribeManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/hands/:
    get:
      operationId: management-hands-list
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: search
          in: query
          description: Matches hand name, scribe name, script name and place name.
          required: false
          schema:
            type: string
        - name: scribe
          in: query
          required: false
          schema:
            type: integer
        - name: item_part
          in: query
          required: false
          schema:
            type: integer
        - name: script
          in: query
          required: false
          schema:
            type: integer
        - name: date
          in: query
          required: false
          schema:
            type: integer
        - name: ordering
          in: query
          description: Comma separated fields, prefix `-` for descending, using `name`, `scribe__name`. Ties are broken by id.
          required: false
          schema:
            type: string
      security:
        - api_key: []
      responses:
        200:
          description: List hands for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandManagementItem'
      tags:
        - scribes-management
    post:
      operationId: management-hands-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandManagementItem'
      responses:
        201:
          description: Created hand row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/hand-descriptions/:
    get:
      operationId: management-hand-descriptions-list
      security:
        - api_key: []
      responses:
        200:
          description: List hand descriptions for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandDescriptionManagementItem'
      tags:
        - scribes-management
    post:
      operationId: management-hand-descriptions-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandDescriptionManagementItem'
      responses:
        201:
          description: Created hand description row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDescriptionManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/scripts/:
    get:
      operationId: management-scripts-list
      security:
        - api_key: []
      responses:
        200:
          description: List scripts for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedRow'
      tags:
        - scribes-management
    post:
      operationId: management-scripts-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedRow'
      responses:
        201:
          description: Created script row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedRow'
      tags:
        - scribes-management
  /api/v1/management/scribes/get_item_images/:
    get:
      operationId: management-get-item-images
      security:
        - api_key: []
      parameters:
        - name: item_part_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List item images for selected item part.
      tags:
        - scribes-management
  /api/v1/management/scribes/hand-descriptions/{id}/:
    delete:
      operationId: management-hand-descriptions-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Hand description deleted.
      tags:
        - scribes-management
    get:
      operationId: management-hand-descriptions-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One hand description row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDescriptionManagementItem'
      tags:
        - scribes-management
    patch:
      operationId: management-hand-descriptions-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandDescriptionManagementItem'
      responses:
        200:
          description: Updated hand description row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDescriptionManagementItem'
      tags:
        - scribes-management
    put:
      operationId: management-hand-descriptions-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandDescriptionManagementItem'
      responses:
        200:
          description: Replaced hand description row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDescriptionManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/hands/{id}/:
    delete:
      operationId: management-hands-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Hand deleted.
      tags:
        - scribes-management
    get:
      operationId: management-hands-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One hand row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandManagementItem'
      tags:
        - scribes-management
    patch:
      operationId: management-hands-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandManagementItem'
      responses:
        200:
          description: Updated hand row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandManagementItem'
      tags:
        - scribes-management
    put:
      operationId: management-hands-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandManagementItem'
      responses:
        200:
          description: Replaced hand row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/scribes/{id}/:
    delete:
      operationId: management-scribes-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Scribe deleted.
      tags:
        - scribes-management
    get:
      operationId: management-scribes-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One scribe row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScribeManagementItem'
      tags:
        - scribes-management
    patch:
      operationId: management-scribes-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScribeManagementItem'
      responses:
        200:
          description: Updated scribe row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScribeManagementItem'
      tags:
        - scribes-management
    put:
      operationId: management-scribes-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScribeManagementItem'
      responses:
        200:
          description: Replaced scribe row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScribeManagementItem'
      tags:
        - scribes-management
  /api/v1/management/scribes/scripts/{id}/:
    delete:
      operationId: management-scripts-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Script deleted.
      tags:
        - scribes-management
    get:
      operationId: management-scripts-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One script row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedRow'
      tags:
        - scribes-management
    patch:
      operationId: management-scripts-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedRow'
      responses:
        200:
          description: Updated script row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedRow'
      tags:
        - scribes-management
    put:
      operationId: management-scripts-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedRow'
      responses:
        200:
          description: Replaced script row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamedRow'
      tags:
        - scribes-management
  /api/v1/scribes/:
    get:
      operationId: scribes-list
      summary: Public list of scribes
      responses:
        200:
          description: Paged scribes, each with its idiographs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scribe'
      tags:
        - scribes
components:
  schemas:
    Idiograph:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        character:
          type: string
    Scribe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        period:
          type: string
          nullable: true
        scriptorium:
          type: string
        idiographs:
          type: array
          items:
            $ref: '#/components/schemas/Idiograph'
    HandDescriptionItem:
      type: object
      properties:
        id:
          type: integer
        source_label:
          type: string
          nullable: true
        content:
          type: string
    Hand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scribe:
          type: integer
        item_part:
          type: integer
        item_part_display_label:
          type: string
        num:
          type: integer
        priority:
          type: integer
        is_default:
          type: boolean
        date:
          type: string
          nullable: true
        place:
          type: string
          nullable: true
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/HandDescriptionItem'
        scriptorium:
          type: string
    ScribeManagementItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        period:
          type: integer
          nullable: true
        period_display:
          type: string
          nullable: true
        scriptorium:
          type: string
          nullable: true
        hand_count:
          type: integer
    HandManagementItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scribe:
          type: integer
        scribe_name:
          type: string
        item_part:
          type: integer
        item_part_display:
          type: string
        script:
          type: integer
          nullable: true
        script_name:
          type: string
          nullable: true
        num:
          type: integer
        priority:
          type: integer
        is_default:
          type: boolean
        date:
          type: integer
          nullable: true
        date_display:
          type: string
          nullable: true
        place:
          type: integer
          nullable: true
        place_display:
          type: string
          nullable: true
        descriptions:
          type: array
          items:
            $ref: '#/components/schemas/HandDescriptionManagementItem'
        item_part_images:
          type: array
          items:
            type: integer
    HandDescriptionManagementItem:
      type: object
      properties:
        id:
          type: integer
        hand:
          type: integer
        source:
          type: integer
          nullable: true
        source_label:
          type: string
          nullable: true
        content:
          type: string

tags:
  - name: scribes
  - name: scribes-management
