paths:
  /api/v1/manuscripts/item-parts/:
    get:
      operationId: item-part-list
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemPart'
      tags:
        - manuscripts
  /api/v1/manuscripts/item-parts/{id}/:
    get:
      operationId: item-part-detail
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPartDetails'
      tags:
        - manuscripts
  /api/v1/manuscripts/item-parts/{id}/tei/:
    get:
      operationId: item-part-msdesc-tei
      description: >-
        Download this part's msDesc description as a standalone TEI P5 document
        (teiHeader/fileDesc/sourceDesc/msDesc plus the empty text/body stub TEI
        requires). Served as an attachment. Only published areas are included —
        for every caller, including superusers; the management twin returns the
        unpublished ones. An area whose stored fragment is not well-formed XML
        is skipped, so the document always parses.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: TEI P5 document, sent as an attachment.
          content:
            application/tei+xml:
              schema:
                type: string
        404:
          description: >-
            Unknown item part, or it has no published, well-formed msDesc areas.
      tags:
        - manuscripts
  /api/v1/manuscripts/item-images/:
    get:
      operationId: item-part-images-list
      parameters:
        - name: item_part
          in: query
          required: false
          schema:
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPartImage'
      tags:
        - manuscripts
  /api/v1/manuscripts/item-images/{id}/:
    get:
      operationId: item-part-images-detail
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPartImage'
      tags:
        - manuscripts
  /api/v1/manuscripts/management/historical-items/:
    get:
      operationId: management-historical-items-list
      parameters:
        - name: ordering
          in: query
          description: Comma separated fields, prefix `-` for descending, using `first_repository_label`, `first_shelfmark`, `type`, `date__min_weight`, `date__max_weight`, `image_count`. Ties are broken by id.
          required: false
          schema:
            type: string
      security:
        - api_key: []
      responses:
        200:
          description: List historical items for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalItemManagementListItem'
      tags:
        - manuscripts-management
    post:
      operationId: management-historical-items-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalItemManagementWrite'
      responses:
        201:
          description: Created historical item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalItemManagementListItem'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/historical-items/{id}/:
    get:
      operationId: management-historical-items-detail
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: Historical item detail with nested parts, images and msDesc areas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalItemManagementDetail'
      tags:
        - manuscripts-management
    delete:
      operationId: management-historical-items-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Historical item deleted.
      tags:
        - manuscripts-management
    patch:
      operationId: management-historical-items-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalItemManagementListItem'
      responses:
        200:
          description: Updated historical item row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalItemManagementListItem'
      tags:
        - manuscripts-management
    put:
      operationId: management-historical-items-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalItemManagementListItem'
      responses:
        200:
          description: Replaced historical item row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalItemManagementListItem'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/item-parts/:
    get:
      operationId: management-item-parts-list
      security:
        - api_key: []
      responses:
        200:
          description: List item parts for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemPartManagementItem'
      tags:
        - manuscripts-management
    post:
      operationId: management-item-parts-create
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPartManagementItem'
      responses:
        201:
          description: Created item part row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPartManagementItem'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/item-parts/{id}/tei/:
    get:
      operationId: management-item-part-msdesc-tei
      description: >-
        Editorial twin of `item-part-msdesc-tei`: the same TEI P5 document, but
        including unpublished areas, so a work-in-progress description can be
        round-tripped through Oxygen or Roma. Superuser only. Unlike the public
        twin it refuses (422) when any area is not well-formed XML, rather than
        silently omitting it.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: TEI P5 document, sent as an attachment.
          content:
            application/tei+xml:
              schema:
                type: string
        404:
          description: >-
            Unknown item part, or it has no msDesc areas at all.
        422:
          description: >-
            At least one msDesc area is not well-formed XML; the body carries
            the per-area errors as `{detail, errors: {area: [{line, col,
            message}]}}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/TeiError'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/item-images/:
