      responses:
        200:
          description: One text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTextDetail'
        404:
          description: Unknown, or not visible to this caller.
      tags:
        - manuscripts
  /api/v1/manuscripts/image-texts/{id}/tei/:
    get:
      operationId: image-texts-tei
      summary: Download the text as a standalone TEI P5 document
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: An attached `.tei` file.
          content:
            application/tei+xml:
              schema:
                type: string
      tags:
