      description: Anonymous and non-staff callers see Live and Reviewed texts only; staff see every status.
      parameters:
        - name: item_image
          in: query
          required: false
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [Transcription, Translation]
      responses:
        200:
          description: Paged texts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageTextDetail'
      tags:
        - manuscripts
  /api/v1/manuscripts/image-texts/{id}/:
    get:
      operationId: image-texts-retrieve
