      responses:
        200:
          description: Transitions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusTransition'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/{id}/transition/:
    post:
      operationId: management-image-texts-transition
      summary: Move a text to another status, with an audit trail
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                to_status:
                  type: string
                  enum: [Draft, Review, Live, Reviewed]
                note:
                  type: string
                assignee:
                  type: integer
                  nullable: true
                  description: Reviewer to nominate when sending to Review.
      responses:
        200:
          description: The updated text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTextManagementItem'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/{id}/link-region/:
    post:
      operationId: management-image-texts-link-region
      summary: Link a text element to an image region
      description: >-
        Send `geometry` to create a new TEXT region (201), or `graph_id` to link an existing TEXT
        region of the same image (200; a trashed region is restored). `element_index` counts the
        linkable elements of the text in document order.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [element_index]
              properties:
                element_index:
                  type: integer
                geometry:
                  type: object
                  description: A GeoJSON Feature.
                graph_id:
                  type: integer
      responses:
        200:
          description: Linked to an existing region.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkRegionResult'
        201:
          description: A new region was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkRegionResult'
        400:
          description: No linkable element at that index, or no such text region on this image.
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/{id}/unlink-region/:
    post:
      operationId: management-image-texts-unlink-region
      summary: Delete a region and strip its references from every text of the image
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_id]
              properties:
                graph_id:
                  type: integer
      responses:
        200:
          description: The updated content of the addressed text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeiContent'
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/{id}/unlink-element/:
    post:
      operationId: management-image-texts-unlink-element
      summary: Remove one element↔region link, keeping the region
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [element_index, graph_id]
              properties:
                element_index:
                  type: integer
                graph_id:
                  type: integer
      responses:
        200:
          description: The updated content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeiContent'
        400:
          description: No linkable element at that index.
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/import-htr/:
    post:
      operationId: management-image-texts-import-htr
      summary: Create a Draft text from PAGE-XML or ALTO HTR output
      description: One `<seg type="line">` per line; lines with a polygon get a TEXT region linked by `corresp`.
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_image, format, xml]
              properties:
                item_image:
                  type: integer
                format:
                  type: string
                  enum: [page, alto]
                xml:
                  type: string
                type:
                  type: string
                  enum: [Transcription, Translation]
                  default: Transcription
                language:
                  type: string
      responses:
        201:
          description: '`{"id", "lines", "regions"}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  lines:
                    type: integer
                  regions:
                    type: integer
        400:
          description: Malformed XML or no text lines.
        404:
          description: Unknown image.
        409:
          description: The image already has a text of that kind.
      tags:
        - manuscripts-management
  /api/v1/manuscripts/management/image-texts/bulk_action/:
    post:
      operationId: management-image-texts-bulk-action
      summary: Transition, relabel or delete many texts at once
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                action:
                  type: string
                  enum: [transition, set_language, delete]
                payload:
                  type: object
                  description: '`{"to_status", "note"?}` for transition, `{"language"}` for set_language.'
      responses:
        200:
          description: '`{"affected": N}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected:
                    type: integer
      tags:
        - manuscripts-management
components:
  parameters:
    TextKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [transcription, translation]
  schemas:
    ImageTextDetail:
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        type:
          type: string
        content:
          type: string
        status:
          type: string
        language:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
    TeiContent:
      type: object
      properties:
        content:
          type: string
    TeiError:
      type: object
      properties:
        line:
          type: integer
        col:
          type: integer
        message:
          type: string
    TextRegionRef:
      type: object
      properties:
        graph_id:
          type: integer
        element:
          type: string
        type:
          type: string
          nullable: true
        text:
          type: string
        exists:
          type: boolean
        is_text:
          type: boolean
        same_image:
          type: boolean
        trashed:
          type: boolean
        geometry:
          type: object
          nullable: true
    LinkRegionResult:
      type: object
      properties:
        graph_id:
          type: integer
        content:
          type: string
    StatusTransition:
      type: object
      properties:
        id:
          type: integer
        from_status:
          type: string
        to_status:
          type: string
        actor:
          type: integer
          nullable: true
        actor_username:
          type: string
          nullable: true
        note:
          type: string
        created:
          type: string
          format: date-time
    Repository:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        location:
          type: string
        url:
          type: string
    BibliographicSource:
      type: object
      description: A catalogue or manuscript description cited by a catalogue number or description.
      properties:
        name:
          type: string
        label:
          type: string
    ItemPartDetails:
      type: object
      properties:
        id:
          type: integer
        display_label:
          type: string
        historical_item:
          type: object
          properties:
            type:
              type: string
            format:
              type: string
            date:
              type: integer
              nullable: true
            date_display:
              type: string
              nullable: true
            probable_text_date:
              type: string
            dating_notes:
              type: string
            catalogue_numbers:
              type: array
              items:
                type: object
                properties:
                  number:
                    type: string
                  url:
                    type: string
                  catalogue:
                    $ref: '#/components/schemas/BibliographicSource'
            descriptions:
              type: array
              items:
                type: object
                properties:
                  source:
                    $ref: '#/components/schemas/BibliographicSource'
                  content:
                    type: string
        current_item:
          type: object
          properties:
            shelfmark:
              type: string
            repository:
              type: object
              $ref: '#/components/schemas/Repository'
        msdesc_areas:
          description: Published TEI msDesc area fragments only (is_published=true).
          type: array
          items:
            type: object
            properties:
              area:
                type: string
                enum: [msIdentifier, msContents, physDesc, history]
              content:
                type: string
    ItemPart:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
