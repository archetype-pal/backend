  /api/v1/manuscripts/image-texts/{id}/regions/:
    get:
      operationId: image-texts-regions
      summary: Resolve the image regions linked from the text's markup
      description: >-
        Each in-text reference (`corresp="#gid-N"`) with whether it resolves to a TEXT graph on
        the same image. Staff also see trashed regions (`trashed: true`) with their geometry.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: The referenced regions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TextRegionRef'
      tags:
        - manuscripts
  /api/v1/manuscripts/image-texts/validate-tei/:
    post:
      operationId: image-texts-validate-tei
      summary: Check a TEI fragment for well-formedness
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeiContent'
      responses:
        200:
          description: '`{"valid": bool, "errors": [{"line", "col", "message"}]}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeiError'
      tags:
        - manuscripts
  /api/v1/manuscripts/image-texts/format-tei/:
    post:
      operationId: image-texts-format-tei
      summary: Lay out a TEI fragment for reading without changing its text
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeiContent'
      responses:
        200:
          description: The formatted fragment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeiContent'
        400:
          description: Malformed markup is rejected rather than reflowed (`errors` as for validate-tei).
      tags:
        - manuscripts
  /api/v1/manuscripts/item-images/{id}/{kind}/:
    get:
