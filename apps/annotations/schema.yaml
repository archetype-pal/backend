paths:
  /api/v1/manuscripts/graphs/:
    get:
      operationId: graphs-list
      summary: List all annotations or filter by item_image and allograph
      parameters:
        - in: query
          name: item_image
          schema:
            type: integer
          required: false
        - in: query
          name: allograph
          schema:
            type: integer
          required: false
        - in: query
          name: annotation_type
          schema:
            type: string
            enum: [image, text, editorial, unknown]
            nullable: true
          required: false
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Graph'
      tags:
        - Annotations
    post:
      operationId: graphs-create
      summary: Create a new annotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Graph'
      responses:
        201:
          content:
            application/json:
              schema:
                type: object
      tags:
        - Annotations
  /api/v1/search/graphs/facets/:
    get:
      operationId: search-graphs-facets
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: object
                    properties:
                      __facet_name__:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            count:
                              type: integer
                            narrow_url:
                              type: string
                  objects:
                    type: object
                    properties:
                      count:
                        type: integer
                      next:
                        type: string
                      previous:
                        type: string
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/GraphSearchResult'
      tags:
        - search
  /api/v1/management/annotations/graphs/:
    get:
      operationId: management-graphs-list
      summary: List graphs for management
      security:
        - api_key: []
      parameters:
        - in: query
          name: deleted
          schema:
            type: boolean
          required: false
          description: >-
            When true, list trashed graphs (soft-deleted, newest first) instead
            of live ones. Default lists live graphs only.
        - in: query
          name: annotation_type
          schema:
            type: string
            enum: [image, text, editorial, unknown]
          required: false
        - in: query
          name: deleted_by__username
          schema:
            type: string
          required: false
          description: Username of the user who trashed the row.
        - in: query
          name: deleted_at__gte
          schema:
            type: string
            format: date-time
          required: false
          description: Only rows trashed at or after this instant (ISO 8601).
        - in: query
          name: deleted_at__lte
          schema:
            type: string
            format: date-time
          required: false
          description: Only rows trashed at or before this instant (ISO 8601).
      responses:
        200:
          description: List graphs for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Graph'
      tags:
        - annotations-management
    post:
      operationId: management-graphs-create
      summary: Create graph for management
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Graph'
      responses:
        201:
          description: Created graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/trash-actors/:
    get:
      operationId: management-graphs-trash-actors
      summary: Usernames that currently have graphs in the trash
      description: >-
        Distinct, sorted usernames of users with at least one trashed graph —
        the option list for the trash "deleted by" filter. Rows whose deleter
        no longer exists are omitted.
      security:
        - api_key: []
      responses:
        200:
          description: Usernames with at least one trashed graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/{id}/restore/:
    post:
      operationId: management-graphs-restore
      summary: Restore a trashed graph
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: The restored graph (deleted_at/deleted_by cleared).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        404:
          description: No trashed graph with this id.
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/{id}/purge/:
    delete:
      operationId: management-graphs-purge
      summary: Permanently delete a trashed graph
      security:
        - api_key: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: >-
            Trashed graph permanently deleted (cascades to its components;
            for TEXT graphs the corresp reference is stripped from the
            transcription). Cannot be undone.
        404:
          description: No trashed graph with this id.
      tags:
        - annotations-management
  /api/v1/management/annotations/graph-components/:
    get:
      operationId: management-graph-components-list
      summary: List graph components for management
      security:
        - api_key: []
      responses:
        200:
          description: List graph components for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    graph:
                      type: integer
                    component:
                      type: integer
                    component_name:
                      type: string
                    features:
                      type: array
                      items:
                        type: integer
      tags:
        - annotations-management

components:
  schemas:
    GraphSearchResult:
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial, unknown]
          nullable: true
        allograph:
          type: integer
        allograph_name:
          type: string
          readOnly: true
        hand:
          type: integer
        graphcomponent_set:
          type: array
          items:
            type: object
            properties:
              component:
                type: integer
              component_name:
                type: string
                readOnly: true
              features:
                type: array
                items:
                  type: integer
              feature_details:
                type: array
                readOnly: true
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
        positions:
          type: array
          items:
            type: integer
        position_details:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        num_features:
          type: integer
          readOnly: true
        is_described:
          type: boolean
          readOnly: true

    Graph:
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial, unknown]
          nullable: true
        allograph:
          type: integer
        allograph_name:
          type: string
          readOnly: true
        hand:
          type: integer
        graphcomponent_set:
          type: array
          items:
            type: object
            properties:
              component:
                type: integer
              component_name:
                type: string
                readOnly: true
              features:
                type: array
                items:
                  type: integer
              feature_details:
                type: array
                readOnly: true
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
        positions:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
        position_details:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        num_features:
          type: integer
          readOnly: true
          example: 4
        is_described:
          type: boolean
          readOnly: true
          example: true
        created:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the annotation is in the trash; null when live.
        deleted_by:
          type: string
          readOnly: true
          nullable: true
          description: Username of whoever trashed it; null when live or if that user was deleted.
  
tags:
  - name: Annotations
  - name: annotations-management
