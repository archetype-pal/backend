paths:
  /api/v1/manuscripts/graphs/:
    get:
      operationId: graphs-list
      summary: List all annotations or filter by item_image and allograph
      parameters:
        - in: query
          name: item_image
          schema:
            type: integer
          required: false
        - in: query
          name: allograph
          schema:
            type: integer
          required: false
        - in: query
          name: hand
          schema:
            type: integer
          required: false
        - in: query
          name: id__in
          schema:
            type: string
          description: Comma-separated list of graph IDs for bulk hydration.
          required: false
        - in: query
          name: annotation_type
          schema:
            type: string
            enum: [image, text, editorial]
            nullable: true
          required: false
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Graph'
      tags:
        - Annotations
  /api/v1/annotations/graphs/:
    post:
      operationId: graphs-create
      summary: Create an annotation from the image viewer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphViewerWrite'
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphViewerWrite'
      tags:
        - Annotations
  /api/v1/annotations/graphs/{id}/:
    patch:
      operationId: graphs-partial-update
      summary: Update an annotation from the image viewer
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphViewerWrite'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphViewerWrite'
      tags:
        - Annotations
    delete:
      operationId: graphs-delete
      summary: Delete an annotation from the image viewer
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Annotation deleted.
      tags:
        - Annotations
  /api/v1/management/annotations/graphs/:
    get:
      operationId: management-graphs-list
      summary: List graphs for management
      security:
        - api_key: []
      parameters:
        - in: query
          name: deleted
          schema:
            type: boolean
          required: false
          description: >-
            When true, list trashed graphs (soft-deleted, newest first) instead
            of live ones. Default lists live graphs only.
        - in: query
          name: annotation_type
          schema:
            type: string
            enum: [image, text, editorial]
          required: false
        - in: query
          name: deleted_by__username
          schema:
            type: string
          required: false
          description: Username of the user who trashed the row.
        - in: query
          name: deleted_at__gte
          schema:
            type: string
            format: date-time
          required: false
          description: Only rows trashed at or after this instant (ISO 8601).
        - in: query
          name: deleted_at__lte
          schema:
            type: string
            format: date-time
          required: false
          description: Only rows trashed at or before this instant (ISO 8601).
        - in: query
          name: ordering
          schema:
            type: string
          required: false
          description: Comma separated fields, prefix `-` for descending, using `id`, `allograph__name`, `hand__name`, `item_image__item_part__current_item__repository__label`, `item_image__item_part__current_item__shelfmark`, `item_image__item_part__current_item_locus`, `item_image__locus`, `annotation_type`, `created`, `deleted_by__username`, `deleted_at`. Ties are broken by id.
      responses:
        200:
          description: List graphs for management.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphManagement'
      tags:
        - annotations-management
    post:
      operationId: management-graphs-create
      summary: Create graph for management
      security:
        - api_key: []
      # Create is routed to GraphWriteManagementSerializer — a leaner field
      # set than Graph (no item_part/image_iiif/allograph_name, which that
      # serializer doesn't return), documented separately as
      # GraphWriteManagement rather than reusing Graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphWriteManagement'
      responses:
        201:
          description: Created graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphWriteManagement'
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/trash-actors/:
    get:
      operationId: management-graphs-trash-actors
      summary: Usernames that currently have graphs in the trash
      description: >-
        Distinct, sorted usernames of users with at least one trashed graph —
        the option list for the trash "deleted by" filter. Rows whose deleter
        no longer exists are omitted.
      security:
        - api_key: []
      responses:
        200:
          description: Usernames with at least one trashed graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/{id}/restore/:
    post:
      operationId: management-graphs-restore
      summary: Restore a trashed graph
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: The restored graph (deleted_at/deleted_by cleared).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphManagement'
        404:
          description: No trashed graph with this id.
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/{id}/purge/:
    delete:
      operationId: management-graphs-purge
      summary: Permanently delete a trashed graph
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: >-
            Trashed graph permanently deleted (cascades to its components;
            for TEXT graphs the corresp reference is stripped from the
            transcription). Cannot be undone.
        404:
          description: No trashed graph with this id.
      tags:
        - annotations-management
  /api/v1/management/annotations/graphs/{id}/:
    delete:
      operationId: management-graphs-delete
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        204:
          description: Graph deleted.
      tags:
        - annotations-management
    get:
      operationId: management-graphs-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One graph row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphManagement'
      tags:
        - annotations-management
    patch:
      operationId: management-graphs-update
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphManagement'
      responses:
        200:
          description: Updated graph row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphManagement'
      tags:
        - annotations-management
    put:
      operationId: management-graphs-replace
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphManagement'
      responses:
        200:
          description: Replaced graph row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphManagement'
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/:
    get:
      operationId: management-graph-proposals-list
      summary: List machine-authored annotation proposals
      description: >-
        The annotation review queue (AI programme W0.5). A proposal is a
        candidate annotation that a model produced; it is not a graph, and no
        read path for graphs returns it. Newest first.
      security:
        - api_key: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, rejected]
          required: false
        - in: query
          name: item_image
          schema:
            type: integer
          required: false
        - in: query
          name: annotation_type
          schema:
            type: string
            enum: [image, text, editorial]
          required: false
        - in: query
          name: ml_job
          schema:
            type: integer
          required: false
          description: The inference ledger row that produced the proposal.
      responses:
        200:
          description: Proposals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphProposal'
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/depth/:
    get:
      operationId: management-graph-proposals-depth
      summary: How many proposals await a decision
      description: >-
        The pending count the reviewer-capacity stop rule reads.
      security:
        - api_key: []
      responses:
        200:
          description: The pending count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/throughput/:
    get:
      operationId: management-graph-proposals-throughput
      summary: What the review queue got through, model by model
      description: >-
        For each model (the ledger's task, provider, model name and version):
        the proposals filed in the window, how many were accepted as filed,
        accepted after a correction, rejected or are still pending, and the
        reviewers' time per decision made in the window. Time is read from
        the gaps between a person's consecutive decisions and hand-made
        annotations; a gap longer than `session_gap_seconds` is a break. The
        same measure is given for annotations made by hand, and `speedup` is
        the ratio of the two.
      security:
        - api_key: []
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: until
          schema:
            type: string
            format: date
          required: false
          description: The window's end, exclusive. Defaults to now.
      responses:
        200:
          description: The report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  since:
                    type: string
                    format: date-time
                  until:
                    type: string
                    format: date-time
                  session_gap_seconds:
                    type: integer
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        task:
                          type: string
                        provider:
                          type: string
                        model_name:
                          type: string
                        model_version:
                          type: string
                        filed:
                          type: integer
                        pending:
                          type: integer
                        accepted:
                          type: integer
                        accepted_as_filed:
                          type: integer
                        accepted_corrected:
                          type: integer
                        rejected:
                          type: integer
                        corrected_letter:
                          type: integer
                        corrected_box:
                          type: integer
                        corrected_hand:
                          type: integer
                        acceptance_rate:
                          type: number
                          nullable: true
                          description: Accepted as filed, of the proposals decided.
                        accepted_rate:
                          type: number
                          nullable: true
                        decision_time:
                          $ref: '#/components/schemas/ProposalTiming'
                        seconds_per_accepted:
                          type: number
                          nullable: true
                          description: Reviewing time per annotation made, rejections and corrections included.
                        speedup:
                          type: number
                          nullable: true
                          description: Seconds per annotation by hand over seconds per annotation made from proposals.
                  by_hand:
                    $ref: '#/components/schemas/ProposalTiming'
        400:
          description: A date that cannot be read, or a window that ends before it starts.
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/{id}/:
    get:
      operationId: management-graph-proposals-retrieve
      summary: Retrieve one annotation proposal
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphProposal'
        404:
          description: No such proposal.
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/{id}/accept/:
    post:
      operationId: management-graph-proposals-accept
      summary: Accept a proposal, creating the graph it describes
      description: >-
        The only path by which machine output becomes an annotation. The new
        graph is recorded against the authenticated reviewer.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        201:
          description: Accepted, and the graph created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  graph_id:
                    type: integer
        409:
          description: >-
            Already decided, or an image proposal still missing its allograph
            or hand; the body's `detail` says which.
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/{id}/correct/:
    post:
      operationId: management-graph-proposals-correct
      summary: Correct a pending proposal's letter, hand or box
      description: >-
        Changes only what is given, and leaves the proposal pending: it creates
        no graph. What the model filed is kept in `proposed` on the first
        correction.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allograph:
                  type: integer
                hand:
                  type: integer
                  description: One of the hands of the page's part.
                annotation:
                  type: object
                  description: >-
                    The box, as a GeoJSON Feature with a Polygon of one closed
                    ring, in the page's pixels with the origin at the bottom left.
      responses:
        200:
          description: The corrected proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphProposal'
        400:
          description: Nothing to correct, or a value that cannot be the proposal's.
        409:
          description: Already decided.
      tags:
        - annotations-management
  /api/v1/management/annotations/proposals/{id}/reject/:
    post:
      operationId: management-graph-proposals-reject
      summary: Reject a proposal, creating nothing
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        200:
          description: Rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [rejected]
        409:
          description: Already decided.
      tags:
        - annotations-management
  /api/v1/manuscripts/graphs/{id}/:
    get:
      operationId: graphs-retrieve
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        200:
          description: One graph row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
      tags:
        - Annotations
components:
  schemas:
    GraphComponent:
      type: object
      properties:
        component:
          type: integer
        component_name:
          type: string
          readOnly: true
        features:
          type: array
          items:
            type: integer
        feature_details:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
    GraphViewerWrite:
      # GraphViewerWriteSerializer's actual field set — the image-viewer
      # create/update endpoint (POST/PATCH /api/v1/annotations/graphs/).
      # Distinct from Graph: no image_iiif (write-only endpoint, not needed),
      # and allograph/hand are nullable here since not every annotation_type
      # requires a classified allograph/hand at creation time.
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        item_part:
          type: integer
          readOnly: true
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial]
          description: Fixed when the annotation is created; an update may only repeat it.
        note:
          type: string
        internal_note:
          type: string
        allograph:
          type: integer
          nullable: true
        allograph_name:
        suggestion:
          type: integer
          writeOnly: true
          description: The proposal this annotation came from, when a model was asked about the shape (W3.5).
          type: string
          readOnly: true
          nullable: true
        hand:
          type: integer
          nullable: true
        positions:
          type: array
          items:
            type: integer
        graphcomponent_set:
          type: array
          items:
            $ref: '#/components/schemas/GraphComponent'
        num_features:
          type: integer
          readOnly: true
        is_described:
          type: boolean
          readOnly: true

    Graph:
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        item_part:
          type: integer
          readOnly: true
        image_iiif:
          type: string
          readOnly: true
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial]
          description: Fixed when the annotation is created; an update may only repeat it.
        note:
          type: string
        internal_note:
          type: string
        allograph:
          type: integer
        allograph_name:
          type: string
          readOnly: true
        hand:
          type: integer
        graphcomponent_set:
          type: array
          items:
            $ref: '#/components/schemas/GraphComponent'
        positions:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
        position_details:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        num_features:
          type: integer
          readOnly: true
          example: 4
        is_described:
          type: boolean
          readOnly: true
          example: true

    GraphManagement:
      # GraphManagementSerializer's actual field set. Was `allOf: [Graph, {...}]`,
      # which inherited item_part/image_iiif from Graph even though this
      # serializer's `fields` list has neither — flattened to match exactly,
      # same reasoning as GraphWriteManagement above.
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        image_display:
          type: string
          readOnly: true
        historical_item:
          type: integer
          readOnly: true
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial]
          description: Fixed when the annotation is created; an update may only repeat it.
        note:
          type: string
        internal_note:
          type: string
        allograph:
          type: integer
        allograph_name:
          type: string
          readOnly: true
        hand:
          type: integer
        hand_name:
          type: string
          readOnly: true
          nullable: true
        positions:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
        position_details:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        graphcomponent_set:
          type: array
          items:
            $ref: '#/components/schemas/GraphComponent'
        num_features:
          type: integer
          readOnly: true
          example: 4
        is_described:
          type: boolean
          readOnly: true
          example: true
        created:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the annotation is in the trash; null when live.
        deleted_by:
          type: string
          readOnly: true
          nullable: true
          description: Username of whoever trashed it; null when live or if that user was deleted.

    GraphWriteManagement:
      # GraphWriteManagementSerializer's actual field set — deliberately not
      # the full Graph shape. No item_part/image_iiif/allograph_name: those
      # are read-only extras GraphSerializer/GraphManagementSerializer add,
      # not part of what create/update on this endpoint accepts or returns.
      type: object
      properties:
        id:
          type: integer
        item_image:
          type: integer
        annotation:
          type: object
        annotation_type:
          type: string
          enum: [image, text, editorial]
          description: Fixed when the annotation is created; an update may only repeat it.
        note:
          type: string
        internal_note:
          type: string
        allograph:
          type: integer
        hand:
          type: integer
        positions:
          type: array
          items:
            type: integer
        graphcomponent_set:
          type: array
          items:
            $ref: '#/components/schemas/GraphComponent'
        num_features:
          type: integer
          readOnly: true
        is_described:
          type: boolean
          readOnly: true

    GraphProposal:
      type: object
      description: Every field is machine-written or set by a decision or a correction.
      properties:
        id:
          type: integer
          readOnly: true
        item_image:
          type: integer
          readOnly: true
        image_display:
          type: string
          readOnly: true
          description: The page's label, as on a graph.
        image_iiif:
          type: string
          nullable: true
          readOnly: true
          description: The page's IIIF info.json URL, so the queue can crop the proposed box.
        historical_item:
          type: integer
          readOnly: true
        item_part:
          type: integer
          readOnly: true
          description: The page's part; a correction may name only one of its hands.
        annotation:
          type: object
          readOnly: true
          description: GeoJSON Feature, as on a graph.
        allograph:
          type: integer
          nullable: true
          readOnly: true
        allograph_name:
          type: string
          nullable: true
          readOnly: true
        hand:
          type: integer
          nullable: true
          readOnly: true
        hand_name:
          type: string
          nullable: true
          readOnly: true
          description: Null when the page's part has no hand recorded; such a proposal cannot be accepted.
        annotation_type:
          type: string
          enum: [image, text, editorial]
          readOnly: true
        confidence:
          type: number
          nullable: true
          readOnly: true
        ml_job:
          type: integer
          nullable: true
          readOnly: true
        model_name:
          type: string
          readOnly: true
          description: The model that produced the proposal, from its ledger row; empty when there is none.
        status:
          type: string
          enum: [pending, accepted, rejected]
          readOnly: true
        reviewer:
          type: integer
          nullable: true
          readOnly: true
        reviewer_username:
          type: string
          readOnly: true
        reviewed:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        reason:
          type: string
          readOnly: true
        accepted_graph:
          type: integer
          nullable: true
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        proposed:
          type: object
          nullable: true
          readOnly: true
          description: >-
            What the model filed, kept when a reviewer first corrected the
            proposal: `annotation`, `allograph` and `hand`. Null when nobody has.
        corrected_by:
          type: integer
          nullable: true
          readOnly: true
        corrected_by_username:
          type: string
          readOnly: true
        corrected:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    ProposalTiming:
      type: object
      description: The working time ended by one kind of action.
      properties:
        actions:
          type: integer
        accepted:
          type: integer
          description: Decisions only, those that made an annotation.
        timed:
          type: integer
          description: The actions that followed another by the same person within the session gap.
        seconds:
          type: number
        mean_seconds:
          type: number
          nullable: true
        median_seconds:
          type: number
          nullable: true

tags:
  - name: Annotations
  - name: annotations-management
