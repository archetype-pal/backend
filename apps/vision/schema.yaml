openapi: 3.0.3
info:
  title: Archetype Vision API
  version: 1.0.0

tags:
  - name: Vision
    description: >-
      Phase 1 of the AI programme, read from the shapes of the glyphs. Glyph
      similarity ("letters like this") is served by the search API, at
      `/api/v1/search/graphs/{id}/similar/`.

paths:
  /api/v1/hands/{id}/similar/:
    get:
      operationId: hands-similar
      summary: The hands whose letters are most like this hand's
      description: >-
        AI programme W1.3. Each hand is compared with every other letter by
        letter: for each allograph both wrote, their average forms (each less
        the allograph's usual form across the corpus) are compared by cosine,
        and the hands' similarity is the mean of those cosines, weighted by
        the fewer forms. `letters` lists what each similarity is made of,
        most compared letter first. The comparison is stored by
        `compare_hands`. A hand with fewer than `minimum_glyphs` glyphs that
        have a current vector, or with no stored comparison yet, has no
        results; `glyphs` says how many it has. A scribe below pk 1 is the
        import's placeholder for an unattributed hand and is given as null.
      tags: [Vision]
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The hand's nearest hands, most alike first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarHands"
        "404":
          description: No such hand.

  /api/v1/scribes/{id}/similar/:
    get:
      operationId: scribes-similar
      summary: The hands whose letters are most like a scribe's hands
      description: >-
        AI programme W1.3, gathered over a scribe's hands. A hand is a match
        when it is among the stored nearest of at least one of the scribe's
        hands and is not attributed to the scribe; `near` says which of the
        scribe's hands, at what rank. Matches near more of the scribe's hands
        come first, then the more alike (`similarity` is the best of `near`).
        `hands` lists the scribe's own hands, whether each has been compared,
        and where the scribe's other hands rank among its nearest
        (`siblings`): how well the comparison finds this scribe, and so how
        far to trust the matches. A scribe below pk 1 is the import's
        placeholder for an unattributed hand, so it is a 404.
      tags: [Vision]
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The hands near the scribe's, those near most of its hands first; at most 20.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScribeSimilarHands"
        "404":
          description: No such scribe, or the placeholder.

  /api/v1/management/vision/pages/{id}/find/:
    post:
      operationId: management-vision-pages-find
      summary: '"Label every long-s on this folio": propose the rest of a letter on a page'
      description: >-
        AI programme W3.4. Superuser only. Give `request`, in words, or
        `allograph`. A request is read against the letters already marked on
        the page: it names a letter by its character and its allograph's name
        ("long-s" is s, long). When it could mean more than one, the answer is
        `ask` with the `options`; when it names none, `cannot` with
        `unknown_letter` and every letter marked on the page. The page is then
        searched for windows shaped like the letter's examples there (the
        `hog-page` descriptor, in-process, at no cost), and what is found goes
        to the annotation review queue as proposals of one ledger job; read
        them at `management/annotations/proposals/?ml_job={job}`. Nothing is
        annotated until a reviewer accepts it. Glyphs already marked and
        pending proposals on the page are never proposed again, so asking
        again finds the next places. A letter needs at least 2 typical
        examples on the page by the hand asked for (`too_few_examples`), and
        letters too small for the page's size are refused (`page_too_large`).
      tags: [Vision]
      parameters:
        - in: path
          name: id
          required: true
          description: The page (item image).
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request: { type: string, maxLength: 500, example: label every long-s on this folio }
                allograph: { type: integer }
                hand:
                  type: integer
                  nullable: true
                  description: Search by this hand's examples only. Without it, every hand's, and the proposals take the hand when the examples share one.
                count: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "201":
          description: Proposals were filed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [proposed] }
                  allograph: { $ref: "#/components/schemas/Letter" }
                  hand: { type: integer, nullable: true }
                  examples: { type: integer, description: The examples searched by. }
                  job: { type: integer, description: The ledger job the proposals belong to. }
                  proposed: { type: integer }
        "200":
          description: A question back, or why it cannot search.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ask, cannot] }
                  reason:
                    type: string
                    enum: [unknown_letter, too_few_examples, page_too_large]
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        allograph: { $ref: "#/components/schemas/Letter" }
                        examples: { type: integer }
                  allograph: { $ref: "#/components/schemas/Letter" }
                  examples: { type: integer }
                  minimum: { type: integer }
                  side: { type: integer, description: The letter's usual side in pixels, for page_too_large. }
                  maximum: { type: integer }
        "400":
          description: Neither or both of `request` and `allograph`, or an unknown allograph or hand.
        "403":
          description: Not a superuser.
        "404":
          description: No such page.
        "503":
          description: The page could not be fetched, or the search was refused (inference is off) or failed; `detail` says which.

components:
  schemas:
    SimilarHands:
      type: object
      required: [hand, glyphs, minimum_glyphs, vectors, computed, results]
      properties:
        hand: { type: integer }
        glyphs:
          type: integer
          description: The hand's glyphs with a current vector.
        minimum_glyphs:
          type: integer
          description: The glyphs with a current vector a hand needs to be compared.
        vectors:
          type: string
          nullable: true
          description: The vectors compared, as encoder@model_version; null with no results.
          example: hog@48px-6cell-9bin-1
        computed:
          type: string
          format: date-time
          nullable: true
        results:
          type: array
          items:
            type: object
            required: [rank, similarity, hand, letters]
            properties:
              rank: { type: integer, example: 1 }
              similarity:
                type: number
                description: The weighted mean cosine over the shared letters, from -1 to 1.
              hand:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  item_part: { type: integer }
                  item_part_display_label: { type: string, example: NRS GD55/117 }
                  scribe:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      name: { type: string }
                  date: { type: string, nullable: true }
                  place: { type: string, nullable: true }
              letters:
                type: array
                items:
                  type: object
                  properties:
                    allograph: { type: integer }
                    name: { type: string, nullable: true }
                    character: { type: string, nullable: true }
                    similarity: { type: number }
                    glyphs:
                      type: array
                      description: How many forms of the letter each hand had, this hand's first.
                      items: { type: integer }
                      minItems: 2
                      maxItems: 2
    ScribeSimilarHands:
      type: object
      required: [scribe, minimum_glyphs, vectors, computed, hands, results]
      properties:
        scribe: { type: integer }
        minimum_glyphs:
          type: integer
          description: The glyphs with a current vector a hand needs to be compared.
        vectors:
          type: string
          nullable: true
          description: The vectors compared, as encoder@model_version; null when none of the scribe's hands is compared.
          example: hog@48px-6cell-9bin-1
        computed:
          type: string
          format: date-time
          nullable: true
        hands:
          type: array
          description: The scribe's hands.
          items:
            type: object
            required: [id, name, item_part, item_part_display_label, compared, siblings]
            properties:
              id: { type: integer }
              name: { type: string }
              item_part: { type: integer }
              item_part_display_label: { type: string, example: NRS GD55/53 }
              compared:
                type: boolean
                description: Whether the hand has stored nearest hands.
              siblings:
                type: array
                description: The scribe's other hands among this one's nearest.
                items:
                  $ref: "#/components/schemas/NearRow"
        results:
          type: array
          items:
            type: object
            required: [hand, similarity, near]
            properties:
              hand:
                description: The matching hand, summarised as in SimilarHands.
                type: object
              similarity:
                type: number
                description: The best similarity to any of the scribe's hands.
              near:
                type: array
                description: The scribe's hands this one is among the nearest of, nearest rank first.
                items:
                  $ref: "#/components/schemas/NearRow"
    NearRow:
      type: object
      required: [hand, rank, similarity]
      properties:
        hand:
          type: integer
          description: One of the scribe's hands.
        rank: { type: integer }
        similarity: { type: number }
    Letter:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: long }
        character: { type: string, example: s }
