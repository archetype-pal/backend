  /api/v1/symbols_structure/management/symbols/characters/{id}/update-structure/:
    post:
      operationId: management-characters-update-structure
      summary: Replace a character's allographs, components and features in one call
      description: >-
        Allographs (and their components/features) absent from the payload are deleted; entries
        with an `id` are updated, entries without one are created.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allographs]
              properties:
                name:
                  type: string
                type:
                  type: string
                  nullable: true
                allographs:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      components:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            component_id:
                              type: integer
                            features:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  set_by_default:
                                    type: boolean
      responses:
        200:
          description: The character with its full structure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterManagementItem'
      tags:
        - symbols-management
components:
  schemas:
    ComponentManagementItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        features:
          type: array
          items:
            type: integer
    AllographComponentManagementItem:
      type: object
      properties:
        id:
          type: integer
        allograph:
          type: integer
        component:
          type: integer
    AllographComponentFeatureManagementItem:
      type: object
      properties:
        id:
          type: integer
        allograph_component:
          type: integer
        feature:
          type: integer
        set_by_default:
          type: boolean
    CharacterManagementItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          nullable: true
        allograph_count:
          type: integer
    Allograph:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        components:
          type: array
          items:
            type: object
            properties:
              component:
              component_id:
                type: integer
              component_name:
                type: string
              features:
                type: array
                items:
                  type: object
                  properties:
                    id: 
                      type: integer
                    name:
                      type: string
                    set_by_default:
                      type: boolean
        positions:
          type: array
          items:
            $ref: '#/components/schemas/NamedRow'
    AllographManagementItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        character:
          type: integer
        character_name:
          type: string
tags:
  - name: Symbols Structure
  - name: symbols-management
